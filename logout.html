<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwethaMart - Logout</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #dff1f4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-card {
            width: 400px;
            background: white;
            border-radius: 18px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(20, 38, 83, 0.12);
        }

        .logout-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f7ed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        h1 {
            color: #14213d;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #68768b;
            font-size: 14px;
            line-height: 1.6;
        }

        .login-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #142653;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-size: 14px;
        }

        .login-btn:hover {
            background: #294273;
        }

    </style>

</head>

<body>

    <div class="logout-card">

        <div class="logout-icon">
            ✓
        </div>

        <h1>
            You have been logged out
        </h1>

        <p>
            Your SwethaMart account has been logged out successfully.
        </p>

        <a href="login.html" class="login-btn">
            Login Again
        </a>

    </div>

</body>

</html>
