<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwethaMart - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Shopping Cart</h1>

    <div class="cart-container">

        <div class="cart-item">
            <div>
                <h3>Product Name</h3>
                <p>₹45000</p>
            </div>

            <div>
                <button>-</button>
                <span>1</span>
                <button>+</button>
                <button>Remove</button>
            </div>
        </div>

        <div class="cart-total">
            <h2>Total: ₹45000</h2>
            <button>Proceed to Checkout</button>
        </div>

    </div>

</body>
</html>
