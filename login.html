<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwethaMart - Login</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="brand">
                <h1>SwethaMart</h1>
                <p>Shop smart.<br>Shop easy.</p>
            </div>

            <div class="welcome">
                <h2>Welcome Back!</h2>
                <p>Login to continue shopping</p>
            </div>

            <form action="dashboard.html">

                <label>Email</label>
                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

            <p class="secure">
                🔒 Secure &amp; safe shopping
            </p>

        </div>

    </div>

</body>
</html>
